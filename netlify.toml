[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"  # nu relatief aan frontend

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/nl/*"
  to = "/_prerender/nl-404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

